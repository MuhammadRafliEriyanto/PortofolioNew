<!doctype html>
<html lang="id">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/vite.svg" />

    <!-- preload Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />

    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <!-- SEO Utama -->
    <title>Muhammad Rafli Eriyanto | Informatics Developer</title>

    <meta
      name="description"
      content="Website resmi Muhammad Rafli Eriyanto (Dolph1nsss), seorang Informatics Developer yang berfokus pada pengembangan aplikasi modern, web development, dan solusi digital inovatif."
    />

    <meta
      name="keywords"
      content="Muhammad Rafli Eriyanto, Dolph1nsss, Informatics Developer, Web Developer, Portfolio Rafli, Developer Indonesia"
    />

    <meta name="author" content="Muhammad Rafli Eriyanto" />

    <!-- Theme / PWA -->
    <meta name="theme-color" content="#030014" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta
      property="og:title"
      content="Muhammad Rafli Eriyanto | Informatics Developer"
    />
    <meta
      property="og:description"
      content="Portofolio resmi Muhammad Rafli Eriyanto (Dolph1nsss), Informatics Developer."
    />
    <meta property="og:image" content="/Meta.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://your-domain.com/" />
    <meta
      name="twitter:title"
      content="Muhammad Rafli Eriyanto | Informatics Developer"
    />
    <meta
      name="twitter:description"
      content="Portofolio Muhammad Rafli Eriyanto (Dolph1nsss)."
    />
    <meta name="twitter:image" content="/Meta.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://your-domain.com/" />

    <!-- Structured Data: Person -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Muhammad Rafli Eriyanto",
        "alternateName": "Dolph1nsss",
        "url": "https://your-domain.com",
        "image": "/Photo.jpg",
        "jobTitle": "Informatics Developer",
        "description": "Seorang Informatics Developer yang berfokus pada pengembangan web, aplikasi modern, dan solusi digital inovatif.",
        "sameAs": [
          "https://www.linkedin.com/in/mhmmd-rafli-107530236/",
          "https://github.com/MuhammadRafliEriyanto",
          "https://www.instagram.com/_dolph1nsss"
        ]
      }
    </script>
  </head>

  <body>
    <!-- Konten teks penting untuk SEO -->
    <header style="display: none">
      <h1>Muhammad Rafli Eriyanto</h1>
      <p>
        Saya adalah seorang Informatics Developer yang berfokus pada
        pengembangan web modern, teknologi digital, dan solusi inovatif.
      </p>
    </header>

    <!-- Root React -->
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
